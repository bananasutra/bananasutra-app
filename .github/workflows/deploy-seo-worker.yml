# Deploy Cloudflare Worker `bananasutra-com-seo` (see workers/seo-worker/wrangler.toml).
# This replaces ad-hoc `npm run deploy` from your laptop for routine releases.
#
# One-time: GitHub → Settings → Secrets and variables → Actions (never commit values).
#   CLOUDFLARE_API_TOKEN — least-privilege API token (e.g. Workers Scripts:Edit,
#     Workers Routes:Edit, Zone:Read for this zone). See Cloudflare “Wrangler CI/CD”.
#   CLOUDFLARE_ACCOUNT_ID — account ID from the dashboard; required because wrangler.toml
#     has no account_id. Store as a secret so it is not in cloneable repo files.
#
# Do not also use Cloudflare dashboard → Worker → Settings → Build → "Connect GitHub"
# for this same Worker, or you will have two pipelines fighting the same deploy.

name: Deploy SEO Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "workers/seo-worker/**"
      - ".github/workflows/deploy-seo-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-seo-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Until third-party actions ship Node 24 runtimes, opt in so GitHub stops
    # annotating checkout/setup-node/wrangler-action as “deprecated on Node 20”.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/seo-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: workers/seo-worker

      - name: Test
        run: npm test
        working-directory: workers/seo-worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: workers/seo-worker

      # Fail fast with a clear message (token empty, wrong account id, or missing API scope).
      - name: Verify Cloudflare credentials
        working-directory: workers/seo-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it under Settings → Secrets and variables → Actions (repository secrets)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx wrangler whoami

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/seo-worker
          wranglerVersion: "4.90.1"
          command: deploy
