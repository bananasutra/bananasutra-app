    <script>
      ;(function (l) {
        if (l.search[1] !== '/') return
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
      })(window.location)
    </script>
    <script>
      (function () {
        var KEY = 'bananasutra-theme'
        var stored = null
        try {
          stored = window.localStorage.getItem(KEY)
        } catch (e) {}
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>

    <script>
      (function () {
        var initialized = false;
        var init = function () {
          if (initialized) return;
          initialized = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-MJLGTXTE5W';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          var gaConfig = { send_page_view: false };
          if (/(?:^|[?&])debug_mode=1(?:&|$)/.test(location.search)) {

    <!-- bs-root-end -->
    <script>
      ;(function () {
        function removeSplash() {
          var el = document.getElementById('app-boot-splash')
          if (el) el.remove()
        }
        var links = Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]'))
        var pending = links.filter(function (link) {
          try {
            return !link.sheet
          } catch (e) {
            return true
          }
        })
        if (pending.length === 0) {
          removeSplash()
          return
        }
        var remaining = pending.length
        function oneDone() {
          remaining -= 1
          if (remaining <= 0) removeSplash()
        }
        pending.forEach(function (link) {
          link.addEventListener('load', oneDone, { once: true })
          link.addEventListener('error', oneDone, { once: true })
        })
      })()
    </script>
